# Packaging: electron-builder (chosen over Forge; documented per spec §11.1)
appId: com.hermeticbots.app
productName: Hermetic Bots
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Local builds are unsigned: hardenedRuntime requires a real signing identity,
  # and enabling it without one produces an app macOS refuses to launch.
  # Signing/notarization get configured at release time; no credentials here.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  title: Hermetic Bots
npmRebuild: false
